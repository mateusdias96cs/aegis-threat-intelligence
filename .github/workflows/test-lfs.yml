name: Test LFS checkout (temporário)

on:
  workflow_dispatch:

jobs:
  verify-lfs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (com LFS)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verificar arquivos .mmdb
        run: |
          ls -la data/**/*.mmdb
          file data/**/*.mmdb
