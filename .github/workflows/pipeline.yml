name: AEGIS Threat Intelligence Pipeline

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Evita que dois runs simultâneos (cron + workflow_dispatch manual) disputem o lock
# de linha do Neon indefinidamente (lock_timeout = 0). Não cancela o run em andamento.
concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    # Teto explícito: se o pipeline travar, o job falha com log claro em vez de
    # consumir o default de 360 min mascarando o problema.
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        run: doppler run -- python -m src.main
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          PYTHONPATH: .
          PYTHONUNBUFFERED: "1"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
